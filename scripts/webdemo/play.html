<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Without this a phone lays the page out at 980px and then scales it down,
     so the canvas is a postage stamp and every control is off the edge. -->
<meta name="viewport" content="width=device-width,initial-scale=1,
      maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>postcode2wad — loading tile</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b0c;color:#dcdcdc;
            font:12px ui-monospace,Consolas,monospace;overflow:hidden;
            /* Otherwise a drag to look pans the page and a two-finger move
               zooms it, both of which fight the controls below. */
            touch-action:none;overscroll-behavior:none;
            -webkit-user-select:none;user-select:none}
  #canvas{display:block;width:100vw;height:100vh;background:#000;outline:0;
          touch-action:none}
  /* dvh follows the mobile browser's collapsing URL bar; vh does not, so the
     bottom of the canvas sits under it for the first scroll. */
  @supports (height:100dvh){#canvas{height:100dvh}}
  #log{position:fixed;left:0;bottom:0;width:100%;max-height:40vh;overflow-y:auto;
       background:rgba(0,0,0,.82);border-top:1px solid #2a2a30;padding:8px 10px;
       white-space:pre-wrap;line-height:1.45;z-index:5;display:none}
  #log .e{color:#db4}
  #log .ok{color:#6c6}
  /* Diagnostic badge. Always visible, never clickable, and carries the build
     stamp so a screenshot proves which build is being looked at — a stale
     play.html (5 min browser cache) otherwise looks exactly like a fix that
     did not work. */
  #diag{position:fixed;top:10px;right:10px;z-index:7;pointer-events:none;
        background:rgba(11,11,12,.82);border:1px solid #2a2a30;padding:6px 9px;
        font-size:11px;line-height:1.5;color:#8a8a92;text-align:right}
  #diag b{color:#dcdcdc;font-weight:400}
  #diag .held{color:#6c6}
  #diag .none{color:#e08a8a}
  #copylog{position:fixed;right:58px;bottom:10px;z-index:7;background:#1a1a1e;
           color:#dcdcdc;border:1px solid #2a2a30;padding:4px 8px;cursor:pointer;
           font:inherit;opacity:.5}
  #copylog:hover{opacity:1}
  #bar{position:fixed;top:0;left:0;height:3px;width:0;background:#c44;z-index:6;
       transition:width .12s linear;pointer-events:none}
  #hide{position:fixed;right:10px;bottom:10px;z-index:7;background:#1a1a1e;
        color:#dcdcdc;border:1px solid #2a2a30;padding:4px 8px;cursor:pointer;
        font:inherit;opacity:.5}
  #hide:hover{opacity:1}
  #back{position:fixed;top:10px;left:10px;z-index:7;color:#8a8a92;
        text-decoration:none;background:rgba(20,20,24,.6);padding:4px 10px;
        border:1px solid #2a2a30}
  #back:hover{color:#dcdcdc}
  /* Every non-interactive overlay must pass clicks through to the canvas.
     #status sits dead centre and is where "click the game to capture the
     mouse" is printed — without this it is a shield over the one place the
     player is being told to click, the canvas click handler never fires, no
     pointer lock is requested, and mouse-look silently falls back to absolute
     positions that stop dead at the window edge. The instruction was its own
     obstacle. #bar is decorative and spans the full width at the top. */
  #status{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);
          color:#8a8a92;z-index:4;text-align:center;line-height:1.8;
          pointer-events:none}
  #modes{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
         z-index:8;background:#131316;border:1px solid #2a2a30;padding:18px;
         display:none;flex-direction:column;gap:10px;min-width:280px}
  #modes h2{margin:0 0 4px;font-size:13px;color:#dcdcdc;font-weight:400;
            letter-spacing:1px}
  #modes button{background:#1a1a1e;color:#dcdcdc;border:1px solid #2a2a30;
                padding:10px 14px;cursor:pointer;font:inherit;text-align:left}
  #modes button:hover{border-color:#c44;background:#742828;color:#fff}
  #modes button b{display:block;font-size:13px;letter-spacing:1px}
  #modes button span{color:#8a8a92;font-size:11px}
  #modes button:hover span{color:#e8b8b8}
  /* The banner is shown whenever the player is within 25 m of a tile edge,
     which on an 800 m tile is a lot of the time — so the box itself must not
     shield the canvas. Only the link inside it is meant to be clickable. */
  #hop{position:fixed;top:22%;left:50%;transform:translateX(-50%);z-index:8;
       display:none;gap:12px;flex-direction:column;align-items:center;
       text-align:center;pointer-events:none}
  #hop a{background:rgba(11,11,12,.88);border:2px solid #c44;color:#dcdcdc;
         padding:16px 26px;text-decoration:none;font:inherit;font-size:17px;
         letter-spacing:1px;pointer-events:auto}
  #hop a:hover{background:#742828;color:#fff}
  #hop b{color:#fff}
  /* Deliberately covers the canvas: any click resumes, so the player does not
     have to find a target while the level is already running underneath. */
  #resume{position:fixed;inset:0;z-index:9;display:flex;align-items:center;
          justify-content:center;background:rgba(11,11,12,.55);cursor:pointer}
  #resume div{background:rgba(11,11,12,.92);border:2px solid #c44;
              padding:18px 30px;font-size:17px;letter-spacing:1px;color:#fff;
              text-align:center}
  #resume span{display:block;font-size:11px;letter-spacing:0;color:#8a8a92;
               margin-top:6px}
  #exited{position:fixed;inset:0;z-index:9;background:rgba(11,11,12,.94);
          display:flex;flex-direction:column;align-items:center;
          justify-content:center;gap:16px;color:#dcdcdc;font-size:14px}
  #exited a{color:#fff;background:#742828;border:1px solid #c44;
            padding:10px 20px;text-decoration:none}
  #exited a:hover{background:#c44}

  /* ---- touch controls ---------------------------------------------------
     Shown only on a coarse pointer, and only once the engine is up. The whole
     layer is transparent to sight and opaque to touch: it has to swallow the
     gestures itself, because the engine's own touch handling is SDL's, which
     Doom does not read. */
  #touch{position:fixed;inset:0;z-index:6;display:none;touch-action:none}
  #stick{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;
         border:2px solid rgba(220,220,220,.34);border-radius:50%;
         background:rgba(11,11,12,.28);display:none}
  #knob{position:absolute;left:50%;top:50%;width:52px;height:52px;
        margin:-26px 0 0 -26px;border-radius:50%;
        background:rgba(204,68,68,.5);border:2px solid rgba(230,230,230,.5)}
  .tbtn{position:absolute;background:rgba(19,19,22,.62);color:#dcdcdc;
        border:1px solid rgba(204,68,68,.75);border-radius:50%;
        width:74px;height:74px;font:inherit;font-size:11px;letter-spacing:1px;
        display:flex;align-items:center;justify-content:center}
  .tbtn.on{background:#742828;color:#fff}
  #useBtn{right:18px;bottom:104px}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
        z-index:7;color:#8a8a92;background:rgba(11,11,12,.7);padding:6px 12px;
        display:none;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div id="bar"></div>
<a id="back" href="./">&larr; map</a>
<div id="status">fetching&hellip;</div>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<div id="modes">
  <h2 id="modesTitle"></h2>
  <button data-scale=""><b>QUALITY</b><span>full resolution</span></button>
  <button data-scale="0.75"><b>BALANCED</b><span>75% render scale, sharper than it sounds</span></button>
  <button data-scale="0.5"><b>PERFORMANCE</b><span>half resolution — for slower machines</span></button>
</div>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <button id="useBtn" class="tbtn">USE</button>
</div>
<div id="hint"></div>
<div id="log"></div>
<div id="diag"></div>
<button id="copylog">copy log</button>
<button id="hide">log</button>

<script>
// Static launcher for the uzdoom-wasm engine. Everything learned the hard
// way on 2026-08-04 is encoded here:
//
//  - The build bakes in noInitialRun: the runtime comes up and then does
//    NOTHING until an explicit Module.callMain(argv). Module.arguments is
//    dead weight. Symptom otherwise: black canvas, zero CPU, no errors.
//  - Module.getPreloadedPackage lets us hand over uzdoom.data from our own
//    fetch; the engine's own streaming fetch was fragile against a simple
//    server and the error it produces does not name the real problem.
//  - The engine must boot behind a user gesture (audio + input capture) —
//    the mode buttons are that gesture.
//  - The IWAD must be freedoom2 (Doom 2 format): these PK3s ship MAP01,
//    which a Doom 1 IWAD cannot reach from its menu at all.
//  - The browser eats the backquote key, so the in-game console is
//    unreachable; anything you would type there goes in via URL params
//    (?fps=1, ?scale=0.5, ?cmd=a,b — and the mode buttons are just scale).
//
// Load order: common.pk3 before the tile. Later files win in the engine, so
// per-tile members would override shared ones if both existed; they don't,
// because the split is by byte-identity.

const qs   = new URLSearchParams(location.search);
const D    = qs.get('d');
const TILE = qs.get('tile');
const PK3  = qs.get('pk3') || (D && TILE ? D + '/tiles/' + TILE + '.pk3' : null);
const COMMON = D ? D + '/common.pk3' : null;
const MAP  = qs.get('map') || 'MAP01';

const CORE = ['engine/uzdoom.pk3', 'engine/game_support.pk3',
              'engine/brightmaps.pk3', 'engine/lights.pk3',
              'engine/game_widescreen_gfx.pk3'];

// Cache-buster for the two PK3s, and the only thing that makes a rebuild
// visible. The host caches `/tiles/` and `common.pk3` for **30 days at the
// edge** because their contents are immutable for a given build — but they
// are not immutable across builds, and a rebuild reuses every URL. Without a
// changed request, a player whose edge has the old tile would keep playing it
// for a month while the bucket held the new one, and nothing anywhere would
// look wrong. `play.html` itself is on the short rule, so bumping this
// propagates in 15 minutes. **Bump it whenever the tile PK3s change.**
const PK3_V = '20260804b';

// URL parameter -> the cvar the PK3's CVARINFO declares for it. Names must
// match hud.py's ENTRY_CVARS exactly; a typo here is silent, because a
// crossing that loses its entry position just spawns you normally.
const ENTRY_CVARS = [
  ['ex', 'p2w_entry_x'], ['ey', 'p2w_entry_y'], ['ez', 'p2w_entry_z'],
  ['ea', 'p2w_entry_ang'], ['edir', 'p2w_entry_dir'],
];

// **Nothing below may be sent negative.** GZDoom starts a new command-line
// parameter at any argument beginning with "-", so a negative value is not
// read as a value at all: the `set` before it silently gets none and the cvar
// keeps its default. Measured, on a real launch — `+set p2w_entry_z -400`
// left the cvar at -1, with nothing in the log. Hence a compass index rather
// than the (dx, dy) the engine-side transition uses, and hence the bias on z,
// which is the one value that legitimately goes below zero (ground here is at
// absolute ordnance-datum height and Kent has plenty of it below datum).
const DIR_CODE = { north: 1, south: 2, east: 3, west: 4 };
const Z_BIAS = 65536;   // must equal ENTRY_Z_BIAS in hud.py

// ?weapon=… — `fist` is a hand and nothing else, `none` strips every weapon
// for an empty-handed walk, `keep` gives back the stock Doom loadout. Carried
// across tile crossings so a choice survives a seam.
//
// The default is set *here* rather than left to the PK3's CVARINFO, even
// though that has the same default, because the two are not equally cheap to
// change: this file rolls out in 15 minutes, and the cvar's own default is
// baked into 200 PK3s that take a district rebuild and a 112 MB upload to
// change. Same value, one of them reversible over lunch.
const WEAPON_MODES = { none: '0', fist: '1', keep: '2' };
const WEAPON = qs.get('weapon') || 'fist';
//: Set by hopUrl when the player crossed a seam while fullscreen. See the
//: comment there: both fullscreen and pointer lock die with the document.
const WANT_FS = qs.get('fs') === '1';

const logEl = document.getElementById('log');
const bar = document.getElementById('bar');
const statusEl = document.getElementById('status');
document.getElementById('hide').onclick = () => {
  logEl.style.display = logEl.style.display === 'block' ? 'none' : 'block';
};

function say(msg, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}
window.addEventListener('error', ev =>
  say('window.onerror: ' + ev.message + ' @ ' + ev.filename + ':' + ev.lineno, 'e'));
window.addEventListener('unhandledrejection', ev =>
  say('unhandledrejection: ' + (ev.reason && ev.reason.message || ev.reason), 'e'));

if (!PK3) {
  statusEl.textContent = 'no tile selected — go back to the map';
  throw new Error('no tile');
}
if (!window.crossOriginIsolated) {
  statusEl.innerHTML = 'this page is not cross-origin isolated, so the engine '
    + 'cannot start.<br>The host must send COOP same-origin and COEP '
    + 'require-corp headers<br>(the bundled _headers file does this on Netlify).';
  throw new Error('not isolated');
}
if (!document.createElement('canvas').getContext('webgl2')) {
  statusEl.textContent = 'WebGL2 is not available in this browser — the engine cannot render.';
  throw new Error('no webgl2');
}

async function grabRaw(name, label) {
  const r = await fetch(name);
  if (!r.ok) throw new Error(name + ' -> HTTP ' + r.status);
  const buf = await r.arrayBuffer();
  say('fetched ' + name + '  ' + (buf.byteLength / 1048576).toFixed(1) + ' MB');
  statusEl.textContent = 'fetching ' + (label || name) + '…';
  return buf;
}

// ---- neighbour hop -------------------------------------------------------
//
// Single-tile PK3s have no in-engine transitions: the engine cannot be handed
// a new file mid-run, so crossing a seam is a page navigation. The channel
// that makes this possible is the telemetry the HUD already prints — P2W TLM
// lines carry the player's map coordinates, and this page is the console.
// Watch them; near an edge with a built neighbour, offer the crossing.
let hopInfo = null;  // {units, byPos} once the manifest arrives
if (D && TILE) {
  fetch(D + '/manifest.json').then(r => r.json()).then(m => {
    const me = m.tiles.find(t => t.id === TILE);
    if (!me) return;
    hopInfo = {
      units: m.size_m * 32,  // 32 map units to the metre
      me,
      byPos: new Map(m.tiles.map(t => [t.ix + ',' + t.iy, t])),
    };
  }).catch(() => {});
}

const hopEl = document.createElement('div');
hopEl.id = 'hop';
document.body.appendChild(hopEl);

// z and the heading come along because the arrival needs them: the ZScript
// rejects a landing spot whose floor is more than 5m from the one you left
// (that is what tells a street apart from the roof beside it), and walking
// through a seam only feels continuous if you are still facing the same way.
const TLM_RE = /P2W TLM \S+ x=(-?\d+) y=(-?\d+) z=(-?\d+) .*?ang=(-?\d+)/;
const EDGE_SHOW = 800;  // 25m out: show where the edge leads
const EDGE_GO = 128;    // 4m out: you are pushing into the boundary — cross

// Crossing is automatic at the boundary, like a region pack, because the
// pointer lock makes clicking a button mean pressing Esc first. Armed only
// after the player has been seen clear of every edge once, so arriving on a
// tile whose spawn is near a border cannot ping-pong straight back.
let hopArmed = false;
let hopping = false;

// Where the player was on the last telemetry line, and which way they were
// facing. Carried into the next page as the entry position — the crossing is a
// new process, so this is the only thing that survives it.
let lastTlm = null;

// The mirroring itself (arrive REENTRY inside the far edge, keep the
// coordinate that runs along the seam) is deliberately NOT done here: the
// ZScript does it, from the same constants the in-engine region transition
// uses. Two copies of that rule in two languages is how the two ends drift
// apart without either looking wrong.
function hopUrl(n, dir) {
  // Fullscreen and pointer lock are per-*document*, so a crossing loses both:
  // the seam is a page navigation, and no browser will let a freshly loaded
  // page take either without a user gesture. The state a player had is
  // therefore carried in the URL and offered back on the far side, which is a
  // click rather than the two or three it otherwise costs to dig fullscreen
  // back out of the engine's menu. Removing the click entirely means not
  // navigating at all — that is M5, not this.
  let u = 'play.html?d=' + encodeURIComponent(D)
        + '&tile=' + encodeURIComponent(n.id)
        + (chosenScale ? '&scale=' + chosenScale : '')
        + (document.fullscreenElement ? '&fs=1' : '')
        + (WEAPON ? '&weapon=' + encodeURIComponent(WEAPON) : '');
  if (lastTlm) {
    // Clamped and biased so every one of these is non-negative; see DIR_CODE.
    u += '&ex=' + Math.max(0, lastTlm.x) + '&ey=' + Math.max(0, lastTlm.y)
       + '&ez=' + (lastTlm.z + Z_BIAS) + '&ea=' + lastTlm.ang
       + '&edir=' + DIR_CODE[dir];
  }
  return u;
}

function tlmWatch(line) {
  const m = TLM_RE.exec(line);
  if (!m) return;
  const x = +m[1], y = +m[2];
  // Recorded before the manifest check: the position is what a crossing
  // carries, and the manifest fetch can still be in flight while the player is
  // already walking.
  lastTlm = { x, y, z: +m[3], ang: ((+m[4] % 360) + 360) % 360 };
  if (!hopInfo || hopping) return;
  const u = hopInfo.units, me = hopInfo.me;
  // y grows northward, x eastward (matches the OSGB grid the tiles live on).
  const dirs = [
    ['north', 0, 1, u - y], ['south', 0, -1, y],
    ['east', 1, 0, u - x], ['west', -1, 0, x],
  ];
  if (!hopArmed && dirs.every(([, , , d]) => d > EDGE_SHOW)) hopArmed = true;

  // Nothing is offered until the crossing is armed, and arriving now lands you
  // 6m inside the edge you came through: without this the first thing every
  // crossing shows is a banner pointing back at the tile you just left, over a
  // seam that is deliberately refusing to fire.
  const offers = [];
  for (const [name, dx, dy, dist] of (hopArmed ? dirs : [])) {
    if (dist > EDGE_SHOW) continue;
    const n = hopInfo.byPos.get((me.ix + dx) + ',' + (me.iy + dy));
    if (!n) continue;
    if (hopArmed && dist < EDGE_GO) {
      hopping = true;
      hopEl.innerHTML = '<a>Entering <b>' + n.title + '</b>&hellip;</a>';
      hopEl.style.display = 'flex';
      location.href = hopUrl(n, name);
      return;
    }
    offers.push([name, n]);
  }
  hopEl.innerHTML = '';
  for (const [name, n] of offers) {
    const a = document.createElement('a');
    a.href = hopUrl(n, name);
    a.innerHTML = 'Ahead ' + name + ': <b>' + n.title + '</b> — keep walking to cross';
    hopEl.appendChild(a);
  }
  hopEl.style.display = offers.length ? 'flex' : 'none';
}

let chosenScale = qs.get('scale') || '';

// A phone has no pointer to lock and no keyboard to press. Coarse pointer AND
// a touch digitiser: a touchscreen laptop reports maxTouchPoints without being
// one of these, and it still has both.
const TOUCH = matchMedia('(pointer: coarse)').matches && navigator.maxTouchPoints > 0;

// Without pointer lock the OS cursor stays live and mouse-look stops at the
// window edge — DOM mouse events are bounded by the window. The browser only
// grants the lock from a user gesture on the element, so: click the canvas
// to capture, Esc releases (browser-enforced), click again to recapture.
// Mirrors the upstream loader, whose comment describes this exact symptom.
let booted = false;
const canvasEl = document.getElementById('canvas');

// `wantLock` is the page's intent, kept apart from the browser's actual state,
// because the two disagree and that disagreement is the whole bug. The engine
// has its own opinion: uzdoom.js imports both _emscripten_request_pointerlock
// and _emscripten_exit_pointerlock (GZDoom's I_CheckNativeMouse driving
// SDL_SetRelativeMouseMode), so it can drop a lock this page took, on its own
// schedule, without telling anyone. GZDoom ignores the return value, so when
// its own request is deferred — emscripten defers whenever there is no
// transient user activation, and the engine calls from the main loop, never a
// gesture — it still believes it is capturing and keeps posting deltas derived
// from the absolute cursor. That is exactly "turning works, with an invisible
// wall at the window edge".
let wantLock = false;

function takeLock(why) {
  if (TOUCH || !booted || document.pointerLockElement === canvasEl) return;
  wantLock = true;
  lockCount.asked++;
  // Focus the canvas before asking. GZDoom releases the mouse whenever it
  // believes the window is not active, and in a wasm build that belief comes
  // from SDL's focus state — which never becomes true if nothing ever focuses
  // the canvas. It is tabindex="-1", so only script can.
  try { canvasEl.focus(); } catch (e) { /* not fatal */ }
  lockLog('requesting lock (' + why + ')');
  retries = 0;
  askOnce(true);
}

// Esc is the problem this exists for. Esc opens GZDoom's menu *and* releases
// the lock (browser-enforced, not ours), and Chrome then refuses to grant it
// again for about 1.25s — "pointer lock cannot be acquired immediately after
// the user has exited the lock". The player's click to close the menu lands
// inside that window, gets refused, and mouse-look is dead until they think
// to click a second time. So a refusal schedules its own retry.
let retries = 0;
let retryTimer = 0;
const MAX_RETRIES = 4;

function askOnce(raw) {
  let p;
  try {
    // unadjustedMovement skips OS pointer acceleration, which is what a game
    // wants — but it is not universally supported, so an unrecognised-option
    // rejection has to fall back to a plain request rather than give up.
    p = raw ? canvasEl.requestPointerLock({ unadjustedMovement: true })
            : canvasEl.requestPointerLock();
  } catch (e) {
    scheduleRetry();
    return;
  }
  // Where it returns a promise, an unhandled rejection is not just noise: it
  // trips the page's own unhandledrejection reporter. Every path is caught.
  if (p && p.catch) p.catch(() => { if (raw) askOnce(false); else scheduleRetry(); });
}

function scheduleRetry() {
  if (!wantLock || document.pointerLockElement === canvasEl) return;
  if (retries >= MAX_RETRIES) {
    lockLog('giving up after ' + retries + ' retries — click the game to try again');
    return;
  }
  retries++;
  clearTimeout(retryTimer);
  // Comfortably past Chrome's ~1.25s cooldown.
  retryTimer = setTimeout(() => {
    if (!wantLock || document.pointerLockElement === canvasEl) return;
    lockLog('retry ' + retries + ' after the browser cooldown');
    askOnce(true);
  }, 1500);
}

// ---- resume after a seam crossing ----------------------------------------
//
// Arriving from a hop that was fullscreen, both fullscreen and the pointer
// lock are gone and only a user gesture can get them back. So: one prompt,
// one click anywhere, both restored together. It is armed once and disarms
// itself, because a stray click much later should not yank the player into
// fullscreen out of nowhere.
function offerResume() {
  if (!WANT_FS || TOUCH) return;
  const el = document.createElement('div');
  el.id = 'resume';
  el.innerHTML = '<div>click to resume<span>fullscreen and mouse look</span></div>';
  document.body.appendChild(el);

  const go = () => {
    el.remove();
    document.removeEventListener('pointerdown', go, true);
    // Fullscreen first: taking the lock re-lays-out nothing, but entering
    // fullscreen does, and doing it the other way round can drop the lock.
    const p = document.documentElement.requestFullscreen
      ? document.documentElement.requestFullscreen()
      : null;
    if (p && p.catch) p.catch(() => lockLog('fullscreen refused'));
    takeLock('resume after crossing');
  };
  // Capture phase, so the click is not eaten by whatever it lands on.
  document.addEventListener('pointerdown', go, true);
}

canvasEl.addEventListener('click', () => takeLock('canvas click'));
// The click that recaptures often lands on an overlay rather than the canvas,
// and a mousedown anywhere in the page is still a user gesture, so honour it.
document.addEventListener('mousedown', () => {
  if (wantLock && !document.pointerLockElement) takeLock('mousedown re-acquire');
});

// ---- pointer lock diagnostics --------------------------------------------
//
// Three theories survived reading the sources — never granted, granted then
// revoked by the engine, or granted but SDL not believing it — and they are
// indistinguishable from the symptom. They are trivially distinguishable from
// a transition log, so log it: every change, with the elapsed time, into the
// same console panel the telemetry uses (the "log" button, bottom right).
const lockT0 = Date.now();
const lockCount = { granted: 0, lost: 0, refused: 0, asked: 0 };
let lastGrant = 0;
const diagEl = document.getElementById('diag');

// Bump on every deploy that changes this file. It is shown on screen so a
// screenshot answers "are you even on the new build?" without anyone having to
// read a cache header.
const BUILD = '20260805f';

function renderDiag() {
  if (TOUCH) { diagEl.style.display = 'none'; return; }
  const held = document.pointerLockElement === canvasEl;
  diagEl.innerHTML =
    'build <b>' + BUILD + '</b><br>'
    + 'pointer lock <b class="' + (held ? 'held' : 'none') + '">'
    + (held ? 'HELD' : 'NOT HELD') + '</b><br>'
    + 'asked ' + lockCount.asked + ' · got ' + lockCount.granted
    + ' · lost ' + lockCount.lost + ' · refused ' + lockCount.refused;
}

function lockLog(msg) {
  say('[lock +' + ((Date.now() - lockT0) / 1000).toFixed(1) + 's] ' + msg);
  renderDiag();
}

// The log is a scrolling div, which is fiddly to select on a desktop and worse
// on a phone, and a bug report that cannot be pasted is a bug report nobody
// sends. One button, whole buffer.
document.getElementById('copylog').addEventListener('click', () => {
  const text = 'build ' + BUILD + ' · ' + navigator.userAgent + '\n'
    + [...logEl.children].map(d => d.textContent).join('\n');
  navigator.clipboard.writeText(text).then(
    () => say('log copied to clipboard', 'ok'),
    () => {
      // Clipboard access can be refused; falling back to a selection at least
      // leaves it one Ctrl+C away rather than dead.
      const r = document.createRange();
      r.selectNodeContents(logEl);
      const s = getSelection();
      s.removeAllRanges();
      s.addRange(r);
      say('could not write to the clipboard — log selected, press Ctrl+C', 'e');
    });
});

document.addEventListener('pointerlockchange', () => {
  const held = document.pointerLockElement === canvasEl;
  if (held) {
    lockCount.granted++;
    lastGrant = Date.now();
    retries = 0;          // a success clears the budget for the next Esc
    clearTimeout(retryTimer);
    lockLog('GRANTED');
  } else {
    lockCount.lost++;
    // How long it survived is the tell. A few milliseconds means the engine
    // revoked it on its next frame; seconds means a human pressed Esc.
    const ms = lastGrant ? Date.now() - lastGrant : -1;
    lockLog('LOST after ' + ms + 'ms'
      + (ms >= 0 && ms < 500 ? ' — engine revoked it, not you' : '')
      + (wantLock ? ' (still wanted)' : ''));
  }
  if (!booted) return;
  if (held) {
    statusEl.textContent = '';
  } else if (wantLock) {
    statusEl.textContent = 'mouse released — click to recapture';
    setTimeout(() => { if (!document.pointerLockElement) statusEl.textContent = ''; }, 3000);
  }
});
// A refused lock is otherwise completely silent, and its symptom — mouse-look
// that works but stops at the window edge — looks like a game bug rather than
// a permission one. The browser refuses for mundane reasons (Chrome imposes a
// short cooldown after Esc), so say it and let the player click again.
document.addEventListener('pointerlockerror', () => {
  lockCount.refused++;
  lockLog('REFUSED by the browser');
  scheduleRetry();
  if (!booted) return;
  statusEl.textContent = 'could not capture the mouse — click the game again';
  setTimeout(() => { if (!document.pointerLockElement) statusEl.textContent = ''; }, 3000);
});

// ---- touch controls ------------------------------------------------------
//
// The engine is a wasm build of a desktop game: it reads keyboard and mouse.
// SDL registers touch handlers (they are in uzdoom.js) but a desktop Doom has
// nothing bound to a finger, and the report from a phone was that the game
// boots and then cannot be played. So rather than hope, speak the language it
// definitely understands — synthesise the key and mouse events it is already
// listening for. Everything below uses GZDoom's *default* bindings on purpose:
// the console is unreachable in a browser (the backquote key never arrives),
// so there is no way to bind anything of our own.
//
// Dispatched on the canvas with bubbles:true, which reaches handlers on the
// canvas, the document and the window — the emscripten build registers on one
// of those three and an event dispatched at the wrong one is simply not seen.
const KEYS = {
  fwd:   ['KeyW', 87, 'w'],
  back:  ['KeyS', 83, 's'],
  left:  ['KeyA', 65, 'a'],       // default WASD strafes; turning is the drag
  right: ['KeyD', 68, 'd'],
  turnL: ['ArrowLeft', 37, 'ArrowLeft'],
  turnR: ['ArrowRight', 39, 'ArrowRight'],
  use:   ['Space', 32, ' '],
};
const held = new Set();

function setKey(name, down) {
  if (down === held.has(name)) return;   // the engine sees edges, not levels
  if (down) held.add(name); else held.delete(name);
  const [code, keyCode, key] = KEYS[name];
  // `code` is the field SDL maps to a scancode; keyCode/which are filled in as
  // well because they are what older builds read, and neither costs anything.
  canvasEl.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', {
    key, code, keyCode, which: keyCode,
    bubbles: true, cancelable: true, composed: true,
  }));
}

// movementX in the constructor is a legacy extension rather than part of
// MouseEventInit, so it is feature-detected rather than assumed: where it is
// missing, looking around falls back to holding the turn keys, which is worse
// but is never nothing.
const MOVEMENT_OK = (() => {
  try { return new MouseEvent('mousemove', { movementX: 7 }).movementX === 7; }
  catch (e) { return false; }
})();

let virtX = window.innerWidth / 2, virtY = window.innerHeight / 2;

function look(dx, dy) {
  if (!MOVEMENT_OK) {
    // Turn by holding an arrow key for as long as the drag keeps pushing.
    setKey('turnL', dx < -1.5);
    setKey('turnR', dx > 1.5);
    return;
  }
  // clientX/clientY move too: when the engine has not got a pointer lock (it
  // cannot, on a phone) SDL derives the relative motion from the absolute
  // position instead, so sending only movementX would arrive as no motion.
  //
  // And therefore this cursor must NOT be clamped to the viewport. It was, and
  // that was the "turning stops when you reach the edge" bug on phones: once
  // virtX saturated at innerWidth every later event reported the same clientX,
  // SDL saw a zero delta, and the view froze — a one-way ratchet that stayed
  // stuck until an equal drag back the other way un-pinned it. On a 390px
  // phone the right-hand look zone gave about 177px of travel before it died.
  // Nothing reads these as a screen position, so they are free to run past the
  // viewport; the delta between consecutive events is the only thing that
  // matters. Do not "fix" the large numbers by recentring either — a jump in
  // clientX is indistinguishable from a real flick and snaps the view.
  virtX += dx;
  virtY += dy;
  canvasEl.dispatchEvent(new MouseEvent('mousemove', {
    movementX: dx, movementY: dy, clientX: virtX, clientY: virtY,
    bubbles: true, cancelable: true, composed: true,
  }));
}

const LOOK_X = 1.1, LOOK_Y = 0.8;   // drag pixels to mouse units
const DEAD = 14, FULL = 58;         // stick deadzone and full-deflection radius

function startTouchControls() {
  const layer = document.getElementById('touch');
  const stick = document.getElementById('stick');
  const useBtn = document.getElementById('useBtn');
  layer.style.display = 'block';

  let moveId = null, moveOx = 0, moveOy = 0;
  let lookId = null, lookX = 0, lookY = 0;

  const release = () => ['fwd', 'back', 'left', 'right', 'turnL', 'turnR']
    .forEach(k => setKey(k, false));

  function aim(dx, dy) {
    const clamp = v => Math.max(-FULL, Math.min(FULL, v));
    dx = clamp(dx); dy = clamp(dy);
    document.getElementById('knob').style.transform =
      'translate(' + dx + 'px,' + dy + 'px)';
    setKey('fwd', dy < -DEAD);
    setKey('back', dy > DEAD);
    setKey('left', dx < -DEAD);
    setKey('right', dx > DEAD);
  }

  layer.addEventListener('touchstart', ev => {
    // Indexed, not for..of: TouchList is only iterable in newer
    // browsers, and the oldest phones are exactly the ones this is for.
    for (let i = 0; i < ev.changedTouches.length; i++) {
      const t = ev.changedTouches[i];
      // Left of the split walks, right of it looks. Two fingers at once is the
      // point: a phone player has to be able to do both.
      if (t.clientX < window.innerWidth * 0.45 && moveId === null) {
        moveId = t.identifier; moveOx = t.clientX; moveOy = t.clientY;
        stick.style.left = moveOx + 'px';
        stick.style.top = moveOy + 'px';
        stick.style.display = 'block';
      } else if (lookId === null) {
        lookId = t.identifier; lookX = t.clientX; lookY = t.clientY;
      }
    }
    ev.preventDefault();
  }, { passive: false });

  layer.addEventListener('touchmove', ev => {
    for (let i = 0; i < ev.changedTouches.length; i++) {
      const t = ev.changedTouches[i];
      if (t.identifier === moveId) aim(t.clientX - moveOx, t.clientY - moveOy);
      else if (t.identifier === lookId) {
        look((t.clientX - lookX) * LOOK_X, (t.clientY - lookY) * LOOK_Y);
        lookX = t.clientX; lookY = t.clientY;
      }
    }
    ev.preventDefault();
  }, { passive: false });

  const end = ev => {
    for (let i = 0; i < ev.changedTouches.length; i++) {
      const t = ev.changedTouches[i];
      if (t.identifier === moveId) {
        moveId = null; stick.style.display = 'none';
        document.getElementById('knob').style.transform = '';
        release();
      } else if (t.identifier === lookId) {
        lookId = null;
        setKey('turnL', false); setKey('turnR', false);
      }
    }
    ev.preventDefault();
  };
  layer.addEventListener('touchend', end, { passive: false });
  layer.addEventListener('touchcancel', end, { passive: false });

  // Doors and switches. Its own listeners, stopping propagation, so pressing
  // it does not also register as the start of a look drag.
  const press = down => ev => {
    ev.stopPropagation(); ev.preventDefault();
    useBtn.classList.toggle('on', down);
    setKey('use', down);
  };
  useBtn.addEventListener('touchstart', press(true), { passive: false });
  useBtn.addEventListener('touchend', press(false), { passive: false });
  useBtn.addEventListener('touchcancel', press(false), { passive: false });

  const hint = document.getElementById('hint');
  hint.innerHTML = 'left side: walk &middot; right side: look &middot; USE opens doors'
    + (MOVEMENT_OK ? '' : '<br>(this browser turns with the drag, not the view)');
  hint.style.display = 'block';
  setTimeout(() => { hint.style.display = 'none'; }, 9000);
}

function boot(args, pkg, files) {
  statusEl.textContent = 'booting…';
  window.Module = {
    canvas: document.getElementById('canvas'),
    getPreloadedPackage: (name, size) => pkg,
    preRun: [function () {
      for (const path in files) FS.writeFile(path, files[path]);
    }],
    onRuntimeInitialized: function () {
      statusEl.textContent = '';
      try {
        Module.callMain(args);
        booted = true;
        if (TOUCH) {
          startTouchControls();
        } else if (WANT_FS) {
          offerResume();
        } else {
          statusEl.textContent = 'click the game to capture the mouse';
          setTimeout(() => {
            if (statusEl.textContent.startsWith('click')) statusEl.textContent = '';
          }, 5000);
        }
      } catch (e) {
        if (!(e && e.name === 'ExitStatus') && !String(e).includes('unwind')) {
          say('callMain threw: ' + e, 'e');
          statusEl.textContent = 'engine failed to start — see log (bottom right)';
        }
      }
    },
    // Quitting from the engine's own menu ends the wasm runtime; without this
    // hook the page just sits there dead with no way back.
    onExit: code => showExited('Thanks for playing.'),
    print: m => { say(m); tlmWatch(m); },
    printErr: m => say(m, 'e'),
    onAbort: m => {
      say('ABORT: ' + m, 'e');
      showExited('The engine crashed — the log (bottom right) has the details.');
    },
  };
  const s = document.createElement('script');
  s.src = 'engine/uzdoom.js';
  s.onerror = () => say('could not load engine/uzdoom.js', 'e');
  document.body.appendChild(s);
}

function showExited(msg) {
  booted = false;  // stop the canvas click handler re-capturing over the overlay
  wantLock = false;  // ...and stop the mousedown re-acquire fighting this exit
  if (document.pointerLockElement) document.exitPointerLock();
  hopEl.style.display = 'none';
  const o = document.createElement('div');
  o.id = 'exited';
  o.innerHTML = '<div>' + msg + '</div>'
    + '<a href="./">&larr; back to the map</a>'
    + '<a href="" onclick="location.reload();return false">play this tile again</a>';
  document.body.appendChild(o);
}

(async () => {
  let pkg;
  const files = {};
  const fileArgs = [];
  try {
    pkg = await grabRaw('engine/uzdoom.data', 'engine data');
    bar.style.width = '40%';
    const want = [...CORE, 'engine/freedoom2.wad'];
    if (COMMON) want.push(COMMON);
    want.push(PK3);
    for (let i = 0; i < want.length; i++) {
      const mine = want[i] === COMMON || want[i] === PK3;
      // The version goes on the request, never on the name: the engine is
      // handed these through its own filesystem, and a lump file called
      // "x.pk3?v=…" is not a PK3 as far as it is concerned.
      const base = '/' + want[i].split('/').pop();
      files[base] = new Uint8Array(
        await grabRaw(mine ? want[i] + '?v=' + PK3_V : want[i], want[i]));
      if (mine) fileArgs.push(base);
      bar.style.width = (40 + (i + 1) / want.length * 60) + '%';
    }
  } catch (err) {
    statusEl.textContent = 'download failed: ' + err.message;
    say('FAILED ' + err.message, 'e');
    return;
  }

  const args = ['-iwad', '/freedoom2.wad', '-file', ...fileArgs, '+map', MAP,
                // Hide the on-screen console echo (the P2W TLM telemetry
                // lines land there every second or so). Display only: they
                // still reach stdout, which the neighbour-hop watcher reads.
                '+con_notifylines', '0'];

  // Arriving from the tile next door. These are the four numbers the in-engine
  // region transition keeps in a field across a ChangeLevel; a page navigation
  // has no fields to keep them in, so they come back through the command line
  // and the ZScript reads them once in WorldLoaded. Integers only — this is a
  // URL, and it is being spliced into an argv.
  for (const [param, cvar] of ENTRY_CVARS) {
    const v = qs.get(param);
    if (v !== null && /^-?\d+$/.test(v)) args.push('+set', cvar, v);
  }
  // hasOwnProperty, not `in`: `in` walks the prototype chain, so ?weapon=
  // constructor would splice a function into the engine's argv.
  if (Object.prototype.hasOwnProperty.call(WEAPON_MODES, WEAPON)) {
    args.push('+set', 'p2w_weapon', WEAPON_MODES[WEAPON]);
  }
  // freelook on every device, not just touch: with it off the engine reads
  // vertical mouse motion as *walking*, so a desktop player cannot look up or
  // down and pushing the mouse forward marches them into whatever is ahead.
  // That is 1994 Doom's default and nobody expects it now — and it reads as
  // "the mouse is broken", which is exactly the complaint it turned up in.
  args.push('+set', 'freelook', '1');
  // Keep the engine from handing the mouse back. Measured 2026-08-05: the page
  // takes the pointer lock, the log reads GRANTED and then immediately LOST.
  // That is GZDoom's I_CheckNativeMouse deciding it wants the native cursor
  // and calling _emscripten_exit_pointerlock — it wants native whenever the
  // mouse is disabled, or whenever it thinks the window is in the background,
  // which a canvas that has never held focus looks exactly like.
  //   use_mouse/m_use_mouse — do not switch to the native cursor on principle
  //   i_pauseinbackground   — do not pause (and release) when it believes it
  //                           has lost focus, which in wasm it wrongly does
  args.push('+set', 'use_mouse', '1', '+set', 'm_use_mouse', '1',
            '+set', 'i_pauseinbackground', '0');
  if (TOUCH) {
    // cl_run because an 800m tile is a long way at Doom's walking pace and a
    // phone has no shift key.
    args.push('+set', 'cl_run', '1');
  }
  if (qs.get('fps') === '1') args.push('+vid_fps', '1');
  const cmds = qs.get('cmd');
  if (cmds) for (const c of cmds.split(',')) {
    const parts = c.trim().split(/\s+/);
    if (parts[0]) args.push('+' + parts[0], ...parts.slice(1));
  }

  statusEl.textContent = '';
  const urlScale = qs.get('scale');
  if (urlScale && /^[0-9.]+$/.test(urlScale)) {
    // Explicit ?scale= skips the chooser — used for testing and deep links.
    boot([...args, '+vid_scalefactor', urlScale], pkg, files);
    return;
  }

  const modes = document.getElementById('modes');
  document.getElementById('modesTitle').textContent =
    'Enter ' + (TILE || PK3.split('/').pop());
  if (TOUCH) {
    // Measured on a desktop CPU, not a phone: a tile is CPU-bound in the wasm
    // main thread, so a phone is the harder case by a distance. Steer, do not
    // decide — the buttons are also the gesture the engine needs to boot.
    const note = document.createElement('span');
    note.style.color = '#8a8a92';
    note.textContent = 'on a phone, start with PERFORMANCE';
    modes.appendChild(note);
  }
  modes.style.display = 'flex';
  for (const b of modes.querySelectorAll('button')) {
    b.onclick = () => {
      modes.remove();
      chosenScale = b.dataset.scale;  // carried into neighbour-hop links
      const extra = b.dataset.scale ? ['+vid_scalefactor', b.dataset.scale] : [];
      say('mode: ' + b.querySelector('b').textContent
          + (b.dataset.scale ? ' (scale ' + b.dataset.scale + ')' : ''), 'ok');
      boot([...args, ...extra], pkg, files);
    };
  }
})();
</script>
</body>
</html>
