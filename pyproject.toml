[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "postcode2wad"
version = "0.0.1"
description = "Generate playable GZDoom levels of real UK places from a postcode"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "James Moores" }]
dependencies = [
    "numpy>=1.26",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
postcode2wad = "postcode2wad.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/postcode2wad"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
