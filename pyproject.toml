[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "postcode2wad"
version = "0.0.1"
description = "Generate playable GZDoom levels of real UK places from a postcode"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "James Moores" }]
dependencies = [
    "numpy>=1.26",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "requests>=2.31",
    # Not optional any more: every PK3 ships generated art (art.py).
    "pillow>=10.0",
    # Reads .osm.pbf extracts. On PyPI this is `osmium` (the pyosmium project);
    # imported as `import osmium`. Required for anything bigger than a small
    # region: Overpass rate-limits at about nine tiles and Kent is 5,800, so a
    # county has to be read off a local extract. Imported lazily, so an install
    # that skips it still works against Overpass.
    "osmium>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
# Only for deploying the web demo, never for building a WAD, so it stays out of
# the runtime dependencies. build-webdemo.py falls back to gzip without it and
# says which it used — but the fallback costs about 8 MB on every cold load
# (86.4 MB of engine files go to 23.9 MB under brotli q11, 32.0 under gzip).
web = ["Brotli>=1.1"]

[project.scripts]
postcode2wad = "postcode2wad.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/postcode2wad"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
